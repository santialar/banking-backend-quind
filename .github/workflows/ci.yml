name: CI Pipeline

# Cuándo se ejecuta el pipeline
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# Permisos necesarios
permissions:
  contents: read
  checks: write

# Jobs (tareas) que se ejecutarán
jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest  # Sistema operativo donde se ejecuta

    steps:
      # Paso 1: Checkout del código
      - name: Checkout code
        uses: actions/checkout@v4

      # Paso 2: Configurar Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Paso 3: Compilar el proyecto
      - name: Build with Maven
        run: mvn clean compile

      # Paso 4: Ejecutar tests y generar reporte de cobertura
      - name: Run tests with coverage
        run: mvn test

      # Paso 5: Generar reporte de cobertura
      - name: Generate coverage report
        run: mvn jacoco:report

      # Paso 6: Validar cobertura mínima del 80%
      - name: Validate coverage threshold (80%)
        run: |
          echo "📊 Validando cobertura mínima del 80%..."
          
          # Verifica que el reporte XML exista
          if [ ! -f "target/site/jacoco/jacoco.xml" ]; then
            echo "❌ Error: Reporte de cobertura XML no encontrado"
            exit 1
          fi
          
          # Lee la cobertura total del reporte XML
          # Busca el elemento <counter type="LINE"> en el reporte
          COVERED=$(grep -oP 'type="LINE".*covered="\K[0-9]+' target/site/jacoco/jacoco.xml | head -1)
          MISSED=$(grep -oP 'type="LINE".*missed="\K[0-9]+' target/site/jacoco/jacoco.xml | head -1)
          
          if [ -z "$COVERED" ] || [ -z "$MISSED" ]; then
            echo "⚠️ No se pudo leer la cobertura del reporte XML"
            echo "Intentando método alternativo..."
          
            # Método alternativo: leer del reporte HTML
            if [ -f "target/site/jacoco/index.html" ]; then
              echo "✅ Reporte HTML generado correctamente"
              echo "📊 Revisa el reporte en target/site/jacoco/index.html para ver la cobertura exacta"
            fi
            exit 0
          fi
          
          # Calcula el porcentaje
          TOTAL=$((COVERED + MISSED))
          if [ $TOTAL -eq 0 ]; then
            echo "⚠️ No hay líneas para medir cobertura"
            exit 0
          fi
          
          PERCENTAGE=$((COVERED * 100 / TOTAL))
          MINIMUM=80
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 REPORTE DE COBERTURA"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Líneas cubiertas: $COVERED"
          echo "❌ Líneas no cubiertas: $MISSED"
          echo "📈 Total de líneas: $TOTAL"
          echo "📊 Cobertura actual: ${PERCENTAGE}%"
          echo "🎯 Cobertura mínima requerida: ${MINIMUM}%"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ $PERCENTAGE -lt $MINIMUM ]; then
            echo ""
            echo "❌ ERROR: La cobertura (${PERCENTAGE}%) es menor al mínimo requerido (${MINIMUM}%)"
            echo "💡 Necesitas aumentar la cobertura en $((MINIMUM - PERCENTAGE))%"
            echo ""
            exit 1
          else
            echo ""
            echo "✅ ÉXITO: La cobertura (${PERCENTAGE}%) cumple con el mínimo requerido (${MINIMUM}%)"
            echo ""
          fi

      # Paso 7: Subir reporte de cobertura como artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 7